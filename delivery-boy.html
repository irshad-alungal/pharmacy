<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PALLIKKAL PHARMACY — Delivery Dashboard</title><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/delivery.css"><style>
*{box-sizing:border-box}.db-wrap{max-width:1200px;margin:0 auto;padding:22px}.db-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.db-head h1{margin:0}.db-note{padding:12px 14px;border-radius:12px;background:#d1fae5;color:#065f46;margin:16px 0}.db-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.db-stat{padding:18px;border:1px solid var(--line,#dbe5df);border-radius:14px;background:var(--card,#fff)}.db-stat strong{display:block;font-size:26px}.db-list{display:grid;gap:12px}.db-order{padding:18px;border:1px solid var(--line,#dbe5df);border-radius:14px;background:var(--card,#fff)}.db-order-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.db-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.db-actions a,.db-actions button,.db-head button{padding:9px 12px;border-radius:9px;border:1px solid #0f766e;color:#0f766e;background:transparent;text-decoration:none;cursor:pointer}.db-actions button.primary{background:#0f766e;color:#fff}.db-actions button:disabled{opacity:.6;cursor:wait}.db-empty{padding:30px;text-align:center;border:1px dashed #9aa9a1;border-radius:14px}.db-small{color:var(--muted,#72827a);font-size:13px}.db-status{display:inline-block;padding:5px 9px;border-radius:20px;background:#e5e7eb;color:#374151;font-size:12px;font-weight:700}.db-status.out{background:#dbeafe;color:#1d4ed8}.db-status.done{background:#d1fae5;color:#065f46}.db-message{min-height:24px;color:var(--muted,#72827a)}@media(max-width:650px){.db-grid{grid-template-columns:1fr 1fr}.db-wrap{padding:14px}}
</style></head><body><main class="db-wrap"><header class="db-head"><div><h1>Delivery Dashboard</h1><p class="db-small">Welcome, <strong id="dbUser">Delivery person</strong></p></div><div><button id="refreshBtn" type="button">Refresh</button> <button id="logoutBtn" type="button">Sign out</button></div></header><div class="db-note">You are signed in to the delivery portal. Only jobs assigned to your account are shown here.</div><p class="db-message" id="dbMessage" role="status" aria-live="polite">Loading assigned deliveries…</p><section class="db-grid"><div class="db-stat"><span class="db-small">Assigned to me</span><strong id="dbTotal">0</strong></div><div class="db-stat"><span class="db-small">Pending / Out</span><strong id="dbPending">0</strong></div><div class="db-stat"><span class="db-small">Delivered</span><strong id="dbDone">0</strong></div></section><section><h2>My deliveries</h2><div class="db-list" id="dbOrders"><div class="db-empty">Loading…</div></div></section></main>
<script type="module">
import { sb } from './assets/js/supabase-client.js';
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const statusName = s => ({pending:'Pending',out:'Out for delivery',done:'Delivered'}[s] || 'Pending');
let jobs = [];
async function ensureDeliverySession() {
 const { data:{ user }, error } = await sb.auth.getUser();
 if (error || !user) { location.replace('delivery-boy-login.html'); return false; }
 const { data: role, error: roleError } = await sb.rpc('my_role');
 if (roleError || role !== 'delivery_person') { await sb.auth.signOut(); location.replace('delivery-boy-login.html'); return false; }
 const { data: profile, error: profileError } = await sb.from('profiles').select('full_name,is_active').eq('id',user.id).single();
 if (profileError || !profile?.is_active) { await sb.auth.signOut(); location.replace('delivery-boy-login.html'); return false; }
 $('dbUser').textContent = profile.full_name || user.email || 'Delivery person';
 return true;
}
function render() {
 $('dbTotal').textContent = jobs.length;
 $('dbPending').textContent = jobs.filter(j => j.status !== 'done').length;
 $('dbDone').textContent = jobs.filter(j => j.status === 'done').length;
 $('dbOrders').innerHTML = jobs.length ? jobs.map(j => {
  const c = j.customer || {}; const status = j.status || 'pending';
  const actions = status === 'pending' ? '<button class="primary" data-status="out">Mark out for delivery</button>' : status === 'out' ? '<button class="primary" data-status="done">Mark delivered</button>' : '<span class="db-status done">Delivery completed</span>';
  return `<article class="db-order" data-job="${esc(j.id)}"><div class="db-order-head"><div><h3>${esc(j.invoice_no || 'Invoice')}</h3><strong>${esc(c.name || 'Customer')}</strong><p class="db-small">${esc(c.address || 'No delivery address recorded')}</p></div><div><strong>${money(j.total)}</strong><p><span class="db-status ${esc(status)}">${esc(statusName(status))}</span></p></div></div><p>Customer phone: ${esc(c.phone || '—')}</p><p class="db-small">Last update: ${j.updated_at ? new Date(j.updated_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}) : '—'}</p><div class="db-actions">${c.phone ? `<a href="tel:${encodeURIComponent(c.phone)}">Call customer</a><a target="_blank" rel="noopener" href="https://wa.me/${String(c.phone).replace(/\D/g,'')}">WhatsApp</a>` : ''}${actions}</div><p class="db-small" data-job-message aria-live="polite"></p></article>`;
 }).join('') : '<div class="db-empty">No deliveries are currently assigned to your account.</div>';
}
async function load() {
 $('dbMessage').textContent = 'Loading your assigned deliveries…';
 const { data, error } = await sb.rpc('delivery_my_jobs');
 if (error) { $('dbMessage').textContent = 'Unable to load deliveries: ' + error.message; jobs = []; render(); return; }
 jobs = Array.isArray(data) ? data : [];
 $('dbMessage').textContent = `${jobs.length} assigned delivery(ies) loaded.`;
 render();
}
$('dbOrders').addEventListener('click', async event => {
 const button = event.target.closest('[data-status]'); if (!button) return;
 const card = button.closest('[data-job]'); const job = jobs.find(j => j.id === card?.dataset.job); if (!job) return;
 button.disabled = true; button.textContent = 'Saving status…';
 const { error } = await sb.rpc('delivery_update_status', { p_invoice_id: job.id, p_status: button.dataset.status });
 if (error) { const msg = card.querySelector('[data-job-message]'); msg.textContent = 'Could not update status: ' + error.message; button.disabled = false; button.textContent = button.dataset.status === 'out' ? 'Mark out for delivery' : 'Mark delivered'; return; }
 const msg = card.querySelector('[data-job-message]'); msg.textContent = button.dataset.status === 'out' ? 'Status updated: Out for delivery.' : 'Status updated: Delivered.';
 await load();
});
$('refreshBtn').addEventListener('click', load);
$('logoutBtn').addEventListener('click', async () => { $('logoutBtn').disabled = true; $('dbMessage').textContent = 'Signing out…'; await sb.auth.signOut(); location.replace('delivery-boy-login.html'); });
if (await ensureDeliverySession()) await load();
</script></body></html>
