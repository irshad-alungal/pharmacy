<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALZA PHARMACY — Administrator login</title>
<style>:root{--g:#0f766e;--bg:#f4f7f6;--t:#14231f}@media(prefers-color-scheme:dark){:root{--bg:#10201d;--t:#e6f2ef}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);display:grid;place-items:center;min-height:100vh;margin:0}
form{background:Canvas;color:CanvasText;padding:2rem;border-radius:12px;width:min(92vw,360px);box-shadow:0 4px 20px #0002;display:grid;gap:.8rem}
h1{margin:0;color:var(--g);font-size:1.4rem}input,button{padding:.7rem;font-size:1rem;border-radius:8px;border:1px solid #8886}
button{background:var(--g);color:#fff;border:0;cursor:pointer}#m{color:#b91c1c;min-height:1.2em}</style></head><body>
<form id="f"><h1>ALZA PHARMACY · Admin</h1><input id="e" type="email" placeholder="Email" required autocomplete="username">
<input id="p" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button><div id="m"></div></form>
<script type="module">
import { sb } from './assets/js/supabase-client.js';
import { signIn } from './assets/js/auth.js';

const form = document.getElementById('f');
const email = document.getElementById('e');
const password = document.getElementById('p');
const message = document.getElementById('m');
const submitButton = form.querySelector('button');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  submitButton.disabled = true;
  message.textContent = 'Signing in...';

  try {
    // Authenticate and create the required work session through the shared auth flow.
    const result = await signIn(email.value.trim(), password.value);

    if (result.error) {
      message.textContent = 'Login failed: ' + result.error.message;
      return;
    }

    // This page is reserved for administrator accounts.
    const { data: role, error: roleError } = await sb.rpc('my_role');

    if (roleError || !['super_admin', 'admin'].includes(role)) {
      await sb.rpc('end_work_session', { p_reason: 'manual' });
      await sb.auth.signOut();
      message.textContent = 'This account does not have administrator access. Please use Staff login.';
      return;
    }

    window.location.assign('billing.html');
  } catch (error) {
    console.error('Administrator sign-in failed:', error);
    message.textContent = 'Sign-in error: ' + (error?.message || 'Please try again.');
  } finally {
    submitButton.disabled = false;
  }
});
</script></body></html>
