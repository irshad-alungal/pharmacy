
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password - PALLIKKAL PHARMACY</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    .panel {
      background: white;
      width: min(90%, 380px);
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0001;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      border: 1px solid #ddd;
    }
    button {
      background: #087f5b;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    #message { margin-top: 15px; }
  </style>
</head>
<body>

<div class="panel">
  <h2>PALLIKKAL PHARMACY</h2>
  <h3>Change Your Password</h3>
  <p>You must create a new password before continuing.</p>

  <form id="passwordForm">
    <input
      type="password"
      id="password"
      placeholder="New password"
      minlength="12"
      autocomplete="new-password"
      required
    >

    <input
      type="password"
      id="confirm"
      placeholder="Confirm new password"
      minlength="12"
      autocomplete="new-password"
      required
    >

    <button type="submit">Update Password</button>
  </form>

  <p id="message" role="status"></p>
</div>

<script type="module">
import { sb } from './assets/js/supabase-client.js';
import { markDailyLogin } from './assets/js/daily-session.js';

const form = document.getElementById('passwordForm');
const message = document.getElementById('message');

const {
  data: { session }
} = await sb.auth.getSession();

if (!session) {
  location.href = 'admin-login.html';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const password =
    document.getElementById('password').value;

  const confirm =
    document.getElementById('confirm').value;

  if (password.length < 12) {
    message.textContent =
      'Password must contain at least 12 characters.';
    return;
  }

  if (password !== confirm) {
    message.textContent = 'Passwords do not match.';
    return;
  }

  message.textContent = 'Updating password...';

  const { error } = await sb.auth.updateUser({
    password: password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  const { data: completed, error: profileError } =
    await sb.rpc('complete_password_change');

  if (profileError || completed !== true) {
    message.textContent =
      'Password updated, but profile update failed. Contact administrator.';
    return;
  }

  const { data: role, error: roleError } = await sb.rpc('my_role');
  if (roleError || !role) {
    message.textContent = 'Password updated, but your role could not be verified. Please sign in again.';
    return;
  }

  // Delivery users must start their daily work session only after the
  // mandatory first-password change has been completed.
  if (role === 'delivery_person') {
    message.textContent = 'Starting delivery session…';
    const { data: started, error: sessionError } = await sb.rpc('start_work_session');
    if (sessionError || started !== true) {
      message.textContent = sessionError?.message || 'Password changed, but the delivery session could not start. Please sign in again.';
      return;
    }
    const { data: { user } } = await sb.auth.getUser();
    if (user?.id) markDailyLogin(user.id);
    location.replace('delivery.html');
    return;
  }

  message.textContent = 'Password updated successfully.';
  location.href = 'billing.html';
});
</script>

</body>
</html>
