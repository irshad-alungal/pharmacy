<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360">
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe7ee"/></linearGradient>
    <linearGradient id="bowlIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d4de"/><stop offset="1" stop-color="#eef3f7"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b3410"/><stop offset=".45" stop-color="#a4561b"/><stop offset="1" stop-color="#5a2a0b"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9eef3"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd8e1"/></linearGradient>
    <linearGradient id="pestle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dee7"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc44a"/><stop offset="1" stop-color="#1c7d2a"/></linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0b2140" stop-opacity=".35"/><stop offset="1" stop-color="#0b2140" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="300" cy="330" rx="250" ry="26" fill="url(#shadow)"/>
  <!-- leaves behind -->
  <g fill="url(#leaf)">
    <path d="M150 150c-30-40-10-90 30-100 10 40 0 85-30 100z"/>
    <path d="M190 140c0-50 40-80 80-70-10 40-40 70-80 70z"/>
    <path d="M120 175c-40-15-55-55-35-85 35 15 50 55 35 85z"/>
    <path d="M255 160c20-40 65-50 90-25-25 30-60 40-90 25z"/>
  </g>
  <!-- bottle -->
  <g>
    <rect x="292" y="62" width="76" height="34" rx="6" fill="url(#cap)"/>
    <rect x="300" y="92" width="60" height="16" rx="3" fill="#e2e8ee"/>
    <path d="M288 112q0-8 10-10h64q10 2 10 10v170q0 14-14 14h-56q-14 0-14-14z" fill="url(#glass)"/>
    <rect x="296" y="160" width="68" height="78" rx="4" fill="#f7f9fb"/>
    <rect x="306" y="176" width="48" height="6" rx="3" fill="#c7d2dc"/>
    <rect x="306" y="190" width="36" height="6" rx="3" fill="#dbe3ea"/>
    <path d="M300 118q6-4 8 0v150q-2 6-8 2z" fill="#ffffff" opacity=".18"/>
  </g>
  <!-- pestle -->
  <g transform="rotate(38 230 120)">
    <rect x="206" y="40" width="36" height="150" rx="18" fill="url(#pestle)"/>
    <ellipse cx="224" cy="186" rx="26" ry="20" fill="url(#pestle)"/>
  </g>
  <!-- mortar -->
  <ellipse cx="185" cy="185" rx="130" ry="26" fill="url(#bowlIn)"/>
  <path d="M55 185q0 110 130 120q130-10 130-120q-65 30-130 30t-130-30z" fill="url(#bowl)"/>
  <path d="M55 185q65 30 130 30t130-30" fill="none" stroke="#c4cfda" stroke-width="2"/>
  <rect x="140" y="300" width="90" height="16" rx="8" fill="#e6ecf1"/>
  <g fill="#178a2b"><rect x="174" y="225" width="22" height="62" rx="2"/><rect x="154" y="245" width="62" height="22" rx="2"/></g>
  <!-- capsules and tablets -->
  <g>
    <g transform="rotate(-18 420 300)"><rect x="395" y="288" width="58" height="24" rx="12" fill="#ffffff"/><path d="M424 288h17a12 12 0 0 1 0 24h-17z" fill="#1d9a3a"/></g>
    <g transform="rotate(12 470 318)"><rect x="440" y="306" width="60" height="24" rx="12" fill="#ffffff"/><path d="M470 306h18a12 12 0 0 1 0 24h-18z" fill="#14853a"/></g>
    <g transform="rotate(-6 360 320)"><rect x="330" y="310" width="54" height="22" rx="11" fill="#1aa04a"/><path d="M357 310h16a11 11 0 0 1 0 22h-16z" fill="#ffffff"/></g>
    <ellipse cx="300" cy="326" rx="20" ry="8" fill="#ffffff"/><ellipse cx="300" cy="323" rx="20" ry="6" fill="#f3f6f9"/>
    <ellipse cx="515" cy="300" rx="18" ry="7" fill="#ffffff"/>
