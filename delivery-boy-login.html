<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALZA Pharmacy — Delivery Person Login</title><link rel="stylesheet" href="assets/css/delivery.css"><link rel="stylesheet" href="assets/css/styles.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg,#10201d);font-family:system-ui,sans-serif;color:var(--text,#f4f8f6)}.db-login{width:min(100%,420px);background:var(--card,#18332d);border:1px solid var(--line,#45645a);border-radius:20px;padding:28px;box-shadow:0 18px 60px #0003}.db-login h1{margin:0 0 8px}.db-login p{color:var(--muted,#a8bbb3);line-height:1.5}.db-login label{display:grid;gap:7px;margin:16px 0}.db-login input{width:100%;padding:13px;border-radius:10px;border:1px solid #789187;background:transparent;color:inherit}.db-login button,.db-link{display:inline-flex;justify-content:center;padding:12px 16px;border-radius:10px;border:0;background:#0f766e;color:#fff;text-decoration:none;cursor:pointer;font-weight:650}.db-login button{width:100%}.db-note{font-size:12px;padding:10px;background:#5b451b33;border-radius:9px}.db-error{color:#ffb4a9;min-height:20px}
</style></head><body><main class="db-login"><h1>ALZA Pharmacy</h1><h2>Delivery Person Login</h2><p>Access your assigned deliveries, customer contact details and delivery updates.</p><div class="db-note"><strong>Frontend preview only:</strong> authentication is not connected yet. These fields demonstrate the screen and do not verify a delivery-person account.</div><form id="loginForm"><label>Delivery ID<input id="deliveryId" required autocomplete="username" placeholder="Enter delivery ID"></label><label>Password / PIN<input id="deliveryPin" type="password" required autocomplete="current-password" placeholder="Enter password or PIN"></label><p class="db-error" id="loginError" role="alert"></p><button type="submit">Sign in (preview)</button></form><p><a class="db-link" href="delivery.html">Back to Delivery Management</a></p></main><script>
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const id=document.getElementById('deliveryId').value.trim();const pin=document.getElementById('deliveryPin').value;if(!id||!pin){document.getElementById('loginError').textContent='Enter your delivery ID and password.';return;}sessionStorage.setItem('alza_delivery_preview_login',id);location.href='delivery-boy.html';});
</script></body></html>
