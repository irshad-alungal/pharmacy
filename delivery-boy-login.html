<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PALLIKKAL PHARMACY — Delivery Person Login</title><link rel="icon" type="image/png" href="assets/images/brand/favicon.png"><meta name="theme-color" content="#02224d"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,#0b3463 0,#02224d 55%,#011735 100%);font-family:Inter,system-ui,sans-serif;color:#0f1d33}.db-login{width:min(100%,430px);background:#fff;border-radius:20px;padding:30px 28px;box-shadow:0 30px 80px #0006}.db-login h1{margin:0 0 18px;display:flex;justify-content:center;padding:14px;border-radius:14px;background:#02224d}.db-login h1 img{width:210px;height:auto;display:block}.db-login h2{margin:0;font:800 1.45rem Montserrat,sans-serif;color:#0f1d33}.db-login p{color:#5b6677;line-height:1.5;margin:6px 0 4px}.db-login label{display:grid;gap:7px;margin:14px 0;font-weight:600;font-size:.92rem}.db-login input{width:100%;height:48px;padding:0 14px;border-radius:10px;border:1.5px solid #c7cfda;background:#fff;color:inherit;font:inherit;outline:0}.db-login input:focus{border-color:#1fbf2a;box-shadow:0 0 0 4px #1fbf2a1f}.db-login button,.db-link{display:inline-flex;justify-content:center;align-items:center;height:50px;padding:0 16px;border-radius:10px;border:0;background:linear-gradient(180deg,#16a51f,#0f8f17);color:#fff;text-decoration:none;cursor:pointer;font-weight:700;font-size:1rem;box-shadow:0 8px 20px #12a01b40}.db-login button{width:100%}.db-login button:disabled{opacity:.6;cursor:wait}.db-link{width:100%;background:#fff;color:#02224d;border:1.5px solid #c7cfda;box-shadow:none;height:46px;font-weight:600}.db-status{min-height:24px;margin:10px 0;color:#0f7a16;font-size:14px}.db-status.error{color:#b42318}.db-note{font-size:12px;padding:10px;background:#fff4e5;border-radius:9px}
</style></head><body><main class="db-login"><h1><img src="assets/images/brand/logo-horizontal.png" alt="Pallikkal Pharmacy" width="210" height="51"></h1><h2>Delivery Person Login</h2><p>Sign in to view only the deliveries assigned to your account and update their delivery status.</p><form id="loginForm"><label>Delivery ID<input id="deliveryId" required maxlength="40" autocomplete="username" autocapitalize="none" placeholder="Enter Delivery ID"></label><label>Password<input id="deliveryPassword" type="password" required autocomplete="current-password" placeholder="Enter password"></label><p class="db-status" id="loginStatus" role="status" aria-live="polite"></p><button id="loginButton" type="submit">Sign in</button></form><p><a class="db-link" href="delivery.html">Back to Delivery Management</a></p></main>
<script type="module">
import { sb, SUPABASE_URL, SUPABASE_ANON_KEY } from './assets/js/supabase-client.js';
import { markDailyLogin } from './assets/js/daily-session.js';
const form = document.getElementById('loginForm');
const status = document.getElementById('loginStatus');
const button = document.getElementById('loginButton');
form.addEventListener('submit', async event => {
 event.preventDefault(); status.className = 'db-status'; status.textContent = 'Checking delivery account…'; button.disabled = true; button.textContent = 'Signing in…';
 try {
  const response = await fetch(`${SUPABASE_URL}/functions/v1/delivery-login`, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY }, body:JSON.stringify({ delivery_id:document.getElementById('deliveryId').value.trim(), password:document.getElementById('deliveryPassword').value }) });
  const result = await response.json().catch(() => ({}));
  if (!response.ok || !result.session) throw new Error(result.error || 'Sign-in failed.');
  status.textContent = 'Credentials verified. Opening your delivery dashboard…';
  const { error } = await sb.auth.setSession({ access_token:result.session.access_token, refresh_token:result.session.refresh_token });
  if (error) throw error;
  const { data: role, error: roleError } = await sb.rpc('my_role');
  if (roleError || role !== 'delivery_person') { await sb.auth.signOut(); throw new Error('This account is not authorized for the delivery portal.'); }
  const { data: profile, error: profileError } = await sb.from('profiles').select('must_change_password,is_active').eq('id', result.session.user.id).single();
  if (profileError || !profile?.is_active) { await sb.auth.signOut(); throw new Error('This delivery account is inactive. Contact the administrator.'); }
  if (profile.must_change_password) {
    status.textContent = 'First login: please set a new password…';
    window.location.assign('change-password.html');
    return;
  }

  status.textContent = 'Starting delivery session…';
  const { data: started, error: sessionError } = await sb.rpc('start_work_session');
  if (sessionError || started !== true) {
    await sb.auth.signOut();
    throw new Error(sessionError?.message || 'Could not start your delivery work session. Contact the administrator.');
  }

  markDailyLogin(result.session.user.id);
  status.textContent = 'Login successful. Redirecting…';
  window.location.assign('delivery.html');
 } catch (error) {
  console.error('Delivery login failed:', error); status.className = 'db-status error'; status.textContent = error.message || 'Unable to sign in. Please try again.';
 } finally { button.disabled = false; button.textContent = 'Sign in'; }
});
</script></body></html>
