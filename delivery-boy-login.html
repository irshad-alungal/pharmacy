<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PALLIKKAL PHARMACY — Delivery Person Login</title><link rel="stylesheet" href="assets/css/delivery.css"><link rel="stylesheet" href="assets/css/styles.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg,#10201d);font-family:system-ui,sans-serif;color:var(--text,#f4f8f6)}.db-login{width:min(100%,420px);background:var(--card,#18332d);border:1px solid var(--line,#45645a);border-radius:20px;padding:28px;box-shadow:0 18px 60px #0003}.db-login h1{margin:0 0 8px}.db-login p{color:var(--muted,#a8bbb3);line-height:1.5}.db-login label{display:grid;gap:7px;margin:16px 0}.db-login input{width:100%;padding:13px;border-radius:10px;border:1px solid #789187;background:transparent;color:inherit}.db-login button,.db-link{display:inline-flex;justify-content:center;padding:12px 16px;border-radius:10px;border:0;background:#0f766e;color:#fff;text-decoration:none;cursor:pointer;font-weight:650}.db-login button{width:100%}.db-login button:disabled{opacity:.6;cursor:wait}.db-status{min-height:24px;margin:12px 0;color:#9fe4d4;font-size:14px}.db-status.error{color:#ffb4a9}.db-note{font-size:12px;padding:10px;background:#5b451b33;border-radius:9px}
</style></head><body><main class="db-login"><h1>PALLIKKAL PHARMACY</h1><h2>Delivery Person Login</h2><p>Sign in to view only the deliveries assigned to your account and update their delivery status.</p><form id="loginForm"><label>Delivery ID<input id="deliveryId" required maxlength="40" autocomplete="username" autocapitalize="none" placeholder="Enter Delivery ID"></label><label>Password<input id="deliveryPassword" type="password" required autocomplete="current-password" placeholder="Enter password"></label><p class="db-status" id="loginStatus" role="status" aria-live="polite"></p><button id="loginButton" type="submit">Sign in</button></form><p><a class="db-link" href="delivery.html">Back to Delivery Management</a></p></main>
<script type="module">
import { sb, SUPABASE_URL, SUPABASE_ANON_KEY } from './assets/js/supabase-client.js';
const form = document.getElementById('loginForm');
const status = document.getElementById('loginStatus');
const button = document.getElementById('loginButton');
form.addEventListener('submit', async event => {
 event.preventDefault(); status.className = 'db-status'; status.textContent = 'Checking delivery account…'; button.disabled = true; button.textContent = 'Signing in…';
 try {
  const response = await fetch(`${SUPABASE_URL}/functions/v1/delivery-login`, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY }, body:JSON.stringify({ delivery_id:document.getElementById('deliveryId').value.trim(), password:document.getElementById('deliveryPassword').value }) });
  const result = await response.json().catch(() => ({}));
  if (!response.ok || !result.session) throw new Error(result.error || 'Sign-in failed.');
  status.textContent = 'Credentials verified. Opening your delivery dashboard…';
  const { error } = await sb.auth.setSession({ access_token:result.session.access_token, refresh_token:result.session.refresh_token });
  if (error) throw error;
  const { data: role, error: roleError } = await sb.rpc('my_role');
  if (roleError || role !== 'delivery_person') { await sb.auth.signOut(); throw new Error('This account is not authorized for the delivery portal.'); }
  const { data: profile, error: profileError } = await sb.from('profiles').select('must_change_password,is_active').eq('id', result.session.user.id).single();
  if (profileError || !profile?.is_active) { await sb.auth.signOut(); throw new Error('This delivery account is inactive. Contact the administrator.'); }
  status.textContent = 'Login successful. Redirecting…';
  window.location.assign(profile.must_change_password ? 'change-password.html' : 'delivery.html');
 } catch (error) {
  console.error('Delivery login failed:', error); status.className = 'db-status error'; status.textContent = error.message || 'Unable to sign in. Please try again.';
 } finally { button.disabled = false; button.textContent = 'Sign in'; }
});
</script></body></html>
