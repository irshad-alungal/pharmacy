<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALZA PHARMACY — Billing</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:1rem;max-width:900px;margin-inline:auto}
input,select,button{padding:.6rem;font-size:1rem;border-radius:8px;border:1px solid #8886}button{cursor:pointer}
table{width:100%;border-collapse:collapse;margin:.8rem 0}td,th{padding:.4rem;border-bottom:1px solid #8884;text-align:left}
.row{display:flex;gap:.5rem;flex-wrap:wrap}.res button{display:block;width:100%;text-align:left;margin:2px 0}#msg{min-height:1.4em}</style></head><body>
<div class="row"><h2 style="flex:1">Billing counter</h2><span id="who"></span><button id="out">Sign out</button></div>
<input id="q" placeholder="Search name or scan barcode" style="width:100%" autofocus><div class="res" id="res"></div>
<table><thead><tr><th>Item</th><th>Batch</th><th>Qty</th><th>Price</th><th></th></tr></thead><tbody id="cart"></tbody></table>
<div class="row"><input id="disc" type="number" min="0" step="0.01" value="0" placeholder="Discount ₹">
<select id="pm"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select>
<strong id="tot" style="flex:1;text-align:right"></strong><button id="pay">Finalize bill</button></div><div id="msg"></div>
<script type="module" src="assets/js/billing.js"></script></body></html>
